 AW_VIN_lore:0 "Norse settlers from Greenland survived in Vinland by trading and intermarrying with the Mi'kmaq and the Haudenosaunee instead of fighting them. Over eight centuries the settlements grew into a commonwealth from the Atlantic to the Great Lakes. Its constitution of 1779 borrowed equally from the Althing and the Great Law of Peace. Vinland is industrial, democratic and isolationist. It has no Pacific coast, no Gulf coast, and Gothic, Lakota and Fusang neighbours it does not entirely trust."
