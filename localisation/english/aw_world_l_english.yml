 AW_BAV_lore:0 "Duke Tassilo III kept his duchy in 788 because there was no Charlemagne to depose him. His descendants united the southern Germans of the Danube and the Alps into a stern Catholic kingdom. Bavaria is the Hanse's poorer, more pious and better-armed southern cousin, and it is ruled by a duke who distrusts merchants, Reds and Avars in that order."
