 AW_AVR_lore:0 "In this world no Charlemagne destroyed the Avar Ring in 796. The Avar Khaganate held the Pannonian plain, absorbed the Magyar tribes when they arrived, and settled into a steppe aristocracy ruling over Slavs, Vlachs and Germans. The khagans converted to Christianity late and halfheartedly. In 1933 Khagan Bayan VI took power in a putsch, and he now preaches a cult of the steppe, of race and of conquest. Moravia, Dacia and Bavaria are frightened, and they are right to be."
