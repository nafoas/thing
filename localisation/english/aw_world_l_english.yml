 aw_faction_north_sea_thing:0 "The North Sea Thing"
 aw.1.t:0 "The World That Was Not"
 aw.1.d:0 "In this world, the Prophet of Islam was never born.\n\nRome and Persia, exhausted by the great war of 602-628, made peace and endured. The Arabs remained divided between Roman and Persian clients. With no Caliphate to cut the Mediterranean in two, Rome kept Egypt, Syria and Africa. Without the Saracen threat there was no Charles Martel, no Charlemagne and no Holy Roman Empire, so Western Europe stayed a mosaic of Gothic, Frankish, Lombard and Saxon kingdoms. With nothing to crusade against, no crusades were ever called. The Baltic pagans kept their gods, and the Fourth Crusade never sacked Constantinople.\n\nThe Mongols still came. They sacked Kiev and Samarkand, but they were stopped at the walls of Constantinople and Ctesiphon, and their khans turned to Buddhism. Anglo-Danish longships reached Vinland and stayed. Gothic caravels crossed to the Gulf but met Mexica and Inca empires that learned to fight back. Gaelic sailors found Hy-Brasil, and Song treasure fleets found Fusang. Across Africa and Asia, empires that Islam's expansion once overthrew or transformed endured: Aksum, Wagadu, Makuria, the Hindu Shahis, Vijayanagara, Majapahit and Srivijaya.\n\nThen came the Great War of 1912-1918. In 1917 the Constantinople Soviet overthrew the Basileus, and the Roman Proletarian Republic was born. In 1921 a magus in Persia proclaimed himself the last Saoshyant.\n\nIt is 1936. The oldest rivalry in the world has a new ideological edge, and every nation on earth must choose a side."
 aw.1.a:0 "And what of us?"
 aw.2.t:0 "The Chronicle of [ROOT.GetNameDef]"
 aw.2.d_other:0 "Our nation has had a turbulent history in this strange world."
 aw.2.a:0 "So it has been. So it shall be."
