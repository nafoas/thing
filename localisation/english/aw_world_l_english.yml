 AW_KAL_lore:0 "There were no Northern Crusades, because the crusading idea was never born. The Finnic peoples of Suomi, Karelia and Estland kept their old gods, their sagas and their freedom, and joined into the Kalevan Realm under an elected council of elders. They are named for the land of heroes in their own epic. Today the Realm is a fiercely egalitarian social democracy whose sauna-lodges double as workers' councils."
