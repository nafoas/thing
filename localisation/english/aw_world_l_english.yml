 AW_CRT_lore:0 "Croatia was founded by Tomislav in 925 and was never folded into Hungary, because there was no Hungary to fold it into. It holds the Dalmatian coast against Lombard, Roman and Avar ambitions alike. It is a Catholic-Orthodox kingdom with a Glagolitic church, a merchant aristocracy and a very anxious foreign ministry."
