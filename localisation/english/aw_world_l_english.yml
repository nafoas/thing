 AW_FRI_lore:0 "The Frisians beat the Franks at sea in the eighth century and never stopped trading. Their 'Frisian Freedom' (no lords, no serfs, only free farmers and merchants under elected potestaats) became the oldest republic in Europe. In the 1760s the Frisian engine started the industrial revolution in the polders. The republic still keeps colonies in Guiana and Curaçao."
