 AW_KRS_lore:0 "The Mongols sacked Kiev in 1240 as they did in our world, but here the Rus' princes rallied around it instead of scattering. After two centuries of tribute, Grand Prince Daniel's heirs threw off the Horde and rebuilt the Golden Gate. The Tsardom of Kievan Rus' is a vast, devout and autocratic Orthodox state. It sees Novgorod as a rebellious province, Romuva as heathen and the Roman Republic as an apostate."
