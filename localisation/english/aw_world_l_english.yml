 AW_AQU_lore:0 "Duke Eudo of Aquitaine never had to beg the Franks for help against an invasion that never came. Aquitaine stayed a separate realm of Gascons, Occitans and Poitevins, home of troubadours and of the strangest heresies of the Middle Ages. It became Europe's first socialist kingdom in 1891, when a general strike in Bordeaux forced the crown to accept the workers' charter."
