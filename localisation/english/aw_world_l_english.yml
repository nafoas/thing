 AW_GTH_lore:0 "In 711 nobody crossed the Strait of Gibraltar. The Visigothic kingdom of Toledo survived its own civil wars and in time united the whole peninsula under the Councils of Toledo. In 1492 Gothic caravels crossed the Atlantic and founded New Gothia on the shores of the Gulf, though they never managed to conquer the great native empires. Since 1931 Hispania has been ruled by a Caudillo who promises to restore the Gothic crown in its old glory."
