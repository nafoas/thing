 AW_CAR_lore:0 "The Slavic principality of Carantania still installs its princes the way it did in 650: a peasant sits on the Prince's Stone and asks the new ruler whether he will be just. Then the prince answers, the peasant gets up and the crowd cheers. It is a small Alpine state that its neighbours protect mostly so that none of them gets it."
