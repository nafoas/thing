 AW_VAR_lore:0 "The Swedes went east rather than west. For a thousand years, Varangians from Uppland and Gotland sailed down the Russian rivers to serve as the guard of the Roman emperors. When the Proletarian Republic abolished the guard in 1918, thousands of veterans came home with Roman gold, Roman ideas and Roman grudges. The Varangian Kingdom is now a cautious monarchy of merchant-earls, torn between the Red Ecumene that still recruits its sons and the democratic republic of Novgorod."
