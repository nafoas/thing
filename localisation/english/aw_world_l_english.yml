 AW_RMV_lore:0 "Without crusades there were no Teutonic Knights. The Baltic peoples (Prussians, Lithuanians, Latvians and Curonians) kept their gods, and in the fourteenth century the Grand Dukes of Lithuania united them into Romuva, named for the great temple of the old faith. Romuva is Europe's last great pagan state, a land of sacred groves, eternal fires and a surprisingly efficient railway. It is ruled jointly by a Grand Duke and the Krivis, the high priest."
