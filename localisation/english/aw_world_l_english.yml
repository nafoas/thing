 AW_BLG_lore:0 "Basil the Bulgar-Slayer died young in this world and the First Bulgarian Empire never fell. For a thousand years the Tsars of Preslav and Constantinople fought, married and betrayed each other. Since the Roman revolution the Bulgar tsardom has become the shield of every monarchy in the Balkans against the Red Ecumene. Tsar Krum IV dreams of finishing what his namesake started in 813."
