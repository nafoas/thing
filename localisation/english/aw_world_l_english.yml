 AW_IBR_lore:0 "Queen Tamar's golden age was never cut short by Mongol and Timurid catastrophes. The Bagrationi kings of Georgia still rule Iberia and Lazica from Tbilisi as a cultured Orthodox kingdom. Their fortresses guard the passes of the Caucasus, and they cannot decide whether to fear Rome or the Khazars more."
