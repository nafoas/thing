 AW_LOM_lore:0 "No Frankish king came over the Alps to save the Pope in 754. The Lombards took Ravenna, then Rome, and crowned their kings with the Iron Crown in Pavia for the next twelve centuries. The Roman Empire held on in Sicily and the south, and has wanted the Eternal City back ever since. In 1922 the Duce marched on Pavia promising to finish the Lombard conquest of Italy, and he has been preparing the Kingdom for war against the Reds of Constantinople ever since."
