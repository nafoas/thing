 AW_VBG_lore:0 "In 922 no envoy came from Baghdad to convert the Volga Bulgars, because there was no Baghdad and nothing to convert them to. The khans of Bolghar stayed true to Tengri, the Eternal Blue Sky. They survived the Mongols by joining them and grew rich on the Volga trade between Novgorod, the Khazars and Persia. Today the Khanate is a Tengrist steppe monarchy of trading cities and horse herds."
