 AW_NOV_lore:0 "Moscow never rose to crush Novgorod, because the Mongol storm that made Moscow broke against Kiev instead. The merchant republic of Lord Novgorod the Great kept its veche assembly and its bell, and sent its river-pirates and fur-traders east across the Urals, through Siberia and over the strait to Alaska. Novgorod is the largest democracy on earth. Its people are proud, quarrelsome and extremely cold."
