 aw_read_the_world_chronicle:0 "Read the Chronicle of the World"
 aw_reformed_bureaucracy:0 "Reformed Chancery"
 aw_reformed_bureaucracy_desc:0 "A modern civil service, at last."
 aw_ancient_glory:0 "Ancient Glory"
 aw_ancient_glory_desc:0 "Our soldiers march under banners that are a thousand years old."
 aw_fortress_nation:0 "Fortress Nation"
 aw_fortress_nation_desc:0 "Every hill a bastion, every town a citadel."
 aw_total_mobilization:0 "Total Mobilization"
 aw_total_mobilization_desc:0 "The whole nation stands ready."
 aw_convene_the_realm:0 "Convene the Great Council"
 aw_convene_the_realm_desc:0 "The [ROOT.GetAdjective] realm must gather its leaders and decide its course in a dangerous decade."
 aw_national_myth:0 "The [ROOT.GetAdjective] Saga"
 aw_national_myth_desc:0 "Every nation of this world has a story. Ours must be taught in every school."
 aw_reform_the_bureaucracy:0 "Reform the Chancery"
 aw_reform_the_bureaucracy_desc:0 "An old state needs a modern administration."
 aw_path_of_the_assembly:0 "Path of the Assembly"
 aw_path_of_the_assembly_desc:0 "Power must rest with the people's chosen representatives."
 aw_path_of_the_vanguard:0 "Path of the Vanguard"
 aw_path_of_the_vanguard_desc:0 "The Roman revolution has shown the way. The workers must rule."
 aw_path_of_the_throne:0 "Path of the Throne"
 aw_path_of_the_throne_desc:0 "Tradition, faith and the crown have carried us for centuries. They will carry us further."
 aw_path_of_the_iron_banner:0 "Path of the Iron Banner"
 aw_path_of_the_iron_banner_desc:0 "Only a nation forged into a single weapon can survive what is coming."
 aw_ancient_glory:0 "Remember Our Ancient Glory"
 aw_ancient_glory_desc:0 "Fourteen centuries of history weigh on us, and inspire us."
 aw_the_great_game:0 "The Great Game"
 aw_the_great_game_desc:0 "Rome and Eranshahr are preparing for war. Every other nation must decide where it stands."
