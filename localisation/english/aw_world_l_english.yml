 AW_HAN_lore:0 "No Charlemagne ever butchered the Saxons at Verden. They converted slowly and willingly, and their trading towns grew into a confederation of free cities governed from Lübeck. There is no 'Germany' in this world, only the Hanse. It is a merchant republic of a hundred towns, the banker of the North, and the owner of colonies in Venezuela. It is rich, liberal, quarrelsome and deeply unsure whether it can fight a real war."
