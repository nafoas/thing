 AW_AKS_lore:0 "Aksum declined in our world partly because Islam redirected the trade of the Red Sea. Here it never did. The Kings of Kings of Aksum still rule both shores of the Red Sea, from the Ethiopian highlands to Himyar in Yemen. They hold the gateway to the Indian Ocean, and the Lombards tried in 1935 to take it from them. That war ended in humiliation for Pavia."
