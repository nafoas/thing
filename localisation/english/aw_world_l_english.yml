l_english:
 # Generated by tools/build_world.py
 RPR_lore:0 "The Rome that never fell. With no Caliphate to tear away Syria, Egypt and Africa, the Empire of the Romans survived the seventh century bruised but whole, outlasted the Mongols behind the Theodosian Walls, and ruled the Mediterranean for another thousand years. In 1917, with the empire starving after the Great War, the Constantinople Soviet stormed the Great Palace and drove the last Basileus into exile. The Roman Proletarian Republic now rules from Sicily to the Nile under the red banner of the Proletarian Synod, and believes Rome was always meant to be universal."
 SAO_lore:0 "The Sasanian realm never fell to Arab armies. It lost wars to Rome and won others, endured the Mongols by converting their khans to the Good Religion, and kept the sacred fires of Zarathustra burning from Ctesiphon to Merv. In 1921 a young magus from Yazd proclaimed himself Astvat-ereta, the last Saoshyant foretold in the Avesta, and the King of Kings knelt before him. The Saoshyantate now prepares for the final battle of Truth against the Lie, and the godless Romans across the Euphrates look very much like the Lie."
 AW_NSE_lore:0 "Cnut the Great's empire of England, Denmark and Norway was meant to die with him. It did not. His sons lived, the Witan and the Things learned to work together, and by 1200 the North Sea Empire was a single maritime state ruled jointly from London and Roskilde. Its longships reached Vinland, Markland and the Cape. Today it is a crowned commonwealth of three peoples with one fleet, governed by the Great Witan and wary of every power that might threaten the sea lanes."
