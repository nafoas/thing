 AW_SRB_lore:0 "The Serbs never met the Ottomans, because there were no Ottomans. Their Grand Župania grew as a Roman client, a Roman rival and a Roman client again. It is a hard mountain realm ruled by a stern grand župan, and it is deeply alarmed that its old patron in Constantinople has started preaching revolution."
