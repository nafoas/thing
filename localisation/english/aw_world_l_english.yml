 AW_SOG_lore:0 "The Sogdians were the great merchants of the Silk Road, and here no Arab general ever burned Samarkand. Their city-states of Samarkand, Bukhara and Khwarazm formed a merchant republic that survived the Mongols by financing them. Zoroastrian, Buddhist, Manichaean and Christian traders all sit in its elected council. It is the crossroads of Asia, and it knows that crossroads tend to get trampled."
