 AW_BUR_lore:0 "The Burgundian kingdom of the Rhône survived both the Franks and the Lombards by holding the Alpine passes and charging everyone a toll. Its kings rule from Lyon over a federation of cantons, prince-bishoprics and banking houses. Burgundy is the richest country in Europe per head and the least interested in anyone else's wars."
