 AW_GAE_lore:0 "No Norman ever crossed the Irish Sea. The High Kings of Ireland, allied with the Gaelic kings of Alba through Dál Riata, built a twin realm on the Brehon law and the learning of the monasteries. The Gaels gave the world Hy-Brasil, discovered in 1512 by sailors who set out to find the fabled isle of Saint Brendan's voyage. Today the Commonwealth is a lively parliamentary state that has never forgotten that the Anglo-Danes once burned Armagh."
