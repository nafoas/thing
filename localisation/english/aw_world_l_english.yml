 AW_HAY_lore:0 "Armenia spent two thousand years as the battlefield between Rome and Persia, and it learned to survive by being too useful to destroy. The Bagratid kings of Ani rule a small, ancient, mountain kingdom from the shores of Lake Van. Every Roman-Persian war starts by marching through it."
