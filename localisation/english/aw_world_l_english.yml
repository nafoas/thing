 aw_arsenals:0 "[ROOT.GetAdjective] Arsenals"
 aw_arsenals_desc:0 "Build the factories of war before we need them."
 aw_academies:0 "Found the Academies"
 aw_academies_desc:0 "Our scholars must match those of Constantinople, Nalanda and Hangzhou."
 aw_heavy_industry:0 "Heavy Industry"
 aw_heavy_industry_desc:0 "Steel, coal and concrete are the foundations of power."
 aw_shipyards:0 "Shipyards"
 aw_shipyards_desc:0 "Whoever controls the sea controls the trade of the world."
 aw_war_economy:0 "War Economy"
 aw_war_economy_desc:0 "Prepare the economy for total war."
 aw_army_reform:0 "Army Reform"
 aw_army_reform_desc:0 "Our army must be modernized for the age of machines."
