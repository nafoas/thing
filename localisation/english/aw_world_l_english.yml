 AW_KHZ_lore:0 "In our world the Khazars were ground down between the Caliphate and the Rus'. Here the Caliphate never existed, and the Jewish Khaganate of Itil held the steppe from the Don to the Irtysh. The Khazar Khagan is a sacred figure who appears once a year. The real ruler is the Bek, who governs a tolerant empire of Jews, Christians, Tengrists and Buddhists from the Volga delta. The Khaganate controls the Caspian oil fields of Baku's northern cousin, Grozny, and everyone wants them."
