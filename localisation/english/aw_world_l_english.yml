 AW_DAC_lore:0 "The Vlachs north of the Danube always called themselves Romans. In 1918 they took the Roman revolution as their own, and the Dacian Soviet Republic was proclaimed in Bucharest under the protection of the Red Ecumene. It is Rome's most loyal ally in Europe, and the Avar Khagan's first target."
