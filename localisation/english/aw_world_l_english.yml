 AW_FRK_lore:0 "Without the Saracen threat there was no Charles Martel and no hammer of Tours. Without Charles Martel there was no Charlemagne. The Merovingian kings kept their long hair and their throne, and their Mayors of the Palace slowly became something like prime ministers. Francia is a sprawling constitutional kingdom from the Loire to the Rhine. It still argues about whether the King should be allowed to cut his hair."
