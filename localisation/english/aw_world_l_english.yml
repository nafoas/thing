 AW_MOR_lore:0 "Great Moravia should have fallen to the Magyars in 907. Here the Magyars were swallowed by the Avars, the Avars were exhausted by Moravia, and the Slavic empire of Svatopluk endured. Its Slavonic liturgy and Glagolitic script spread across the Slavic world. Today it is a prosperous industrial republic from Bohemia to Kraków, and it guards its southern border against the Khagan."
