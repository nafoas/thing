 AW_HYB_lore:0 "Gaelic monks had long told of Hy-Brasil, a blessed isle in the western ocean. In 1512 Irish sailors went looking for it and found a continent. The colony mixed with the Tupi and Tupinambá, freed itself from the High King in 1822, and is now an enormous Gaelic-Tupi republic of coffee, rubber and rapid growth."
