 # ---- Parties ----
 RPR_communism_party:0 "Proletarian Synod"
 RPR_communism_party_long:0 "Holy and Proletarian Synod of the Romans"
 RPR_neutrality_party:0 "Basilikoi"
 RPR_neutrality_party_long:0 "Loyalists of the Exiled Basileus"
 SAO_neutrality_party:0 "Magi"
 SAO_neutrality_party_long:0 "Council of Magi of the Saoshyant"
 SAO_communism_party:0 "Mazdakites"
 SAO_communism_party_long:0 "Neo-Mazdakite Workers' Movement"

 # ---- Leaders ----
 POLITICS_IOANNES_KOMNENOS_MARKOS_DESC:0 "Born in the Phanar to a dockworker and a disgraced Komnenian cousin, Ioannes Komnenos-Markos read Marx in Greek translation in a monastery library and came out of it a revolutionary. In 1917 he led the Constantinople Soviet as it stormed the Great Palace and sent the last Basileus into exile. He now rules from the same palace, under the same mosaics, as General Secretary of the Proletarian Synod."
 POLITICS_ANDRONIKOS_LASKARIS_DESC:0 "A former strategos of the Thrakesion theme, Andronikos Laskaris speaks for the officers and churchmen who still remember the Basileus."
 POLITICS_ASTVAT_ERETA_DESC:0 "The Avesta promised that at the end of time a last saviour, Astvat-ereta, would be born of the seed of Zarathustra to defeat the Lie and renew the world. In 1921 a young magus from Yazd stood before the Atash Behram and proclaimed that the time had come. The King of Kings knelt. Now the Saoshyant rules Eranshahr from Tehran, and the fire temples burn day and night."

 # ---- National spirits ----
 rpr_heirs_of_justinian:0 "Heirs of Justinian"
 rpr_heirs_of_justinian_desc:0 "Fourteen centuries of unbroken administration give the Republic a bureaucracy that no other socialist state can match."
 rpr_iconoclast_marxism:0 "Iconoclast Marxism"
 rpr_iconoclast_marxism_desc:0 "The Synod has smashed the icons of the old order and of the old Church. Only the image of the worker remains."
 rpr_iconodule_marxism:0 "Iconodule Marxism"
 rpr_iconodule_marxism_desc:0 "The revolution keeps its saints: Spartacus, the Zealots of Thessalonica, the martyrs of 1917. Their icons hang in every factory."
 rpr_constantinople_soviet:0 "The Constantinople Soviet"
 rpr_constantinople_soviet_desc:0 "The Soviet of the Queen of Cities sits in the Hippodrome, and the Blues and the Greens both now wear red."
 rpr_red_themata:0 "Red Themata"
 rpr_red_themata_desc:0 "The old theme system is back as people's military districts. Every worker-soldier owes service to his theme."
 rpr_varangian_guard:0 "The Red Varangian Guard"
 rpr_varangian_guard_desc:0 "Volunteers from every proletariat in Europe come to serve in the Republic's elite guard, as the Norsemen did before them."
 rpr_greek_fire:0 "Greek Fire Programme"
 rpr_greek_fire_desc:0 "The secret of Callinicus has been rediscovered in the people's laboratories and put to industrial use."
 sao_rule_of_the_saoshyant:0 "Rule of the Saoshyant"
 sao_rule_of_the_saoshyant_desc:0 "The Saoshyant's word is law, scripture and prophecy at once. Few would dare dispute it, and fewer still would dare to innovate."
 sao_flame_of_atar:0 "Flame of Atar"
 sao_flame_of_atar_desc:0 "A sacred fire is kindled in every factory and every barracks. To let it go out is a sin."
 sao_council_of_magi:0 "Council of Magi"
 sao_council_of_magi_desc:0 "The priestly caste runs the Saoshyantate's administration with the efficiency of the old Sasanian chancery."
 sao_immortals_reborn:0 "The Immortals Reborn"
 sao_immortals_reborn_desc:0 "Ten thousand picked soldiers, always kept at full strength, as in the days of Cyrus."
 sao_path_of_the_lone_flame:0 "Path of the Lone Flame"
 sao_path_of_the_lone_flame_desc:0 "Eranshahr needs no allies. Its mountains and its faith are fortress enough."
 sao_frashokereti:0 "Frashokereti"
 sao_frashokereti_desc:0 "The final renovation of the world has begun. The Lie will be defeated and all of creation made perfect."

 # ---- Factions ----
 rpr_faction_red_ecumene:0 "The Red Ecumene"
 sao_faction_sacred_fire:0 "Concord of the Sacred Fire"

 # ---- Roman focus tree ----
 rpr_proletarian_synod:0 "Convene the Proletarian Synod"
 rpr_proletarian_synod_desc:0 "Bishops of the revolution and delegates of the workers will meet in the Hagia Sophia to set the course of the Republic."
 rpr_constantinople_soviet:0 "Power to the Constantinople Soviet"
 rpr_constantinople_soviet_desc:0 "The Soviet of the capital will be made the heart of the state."
 rpr_red_themata:0 "Reform the Red Themata"
 rpr_red_themata_desc:0 "Each military district will raise, train and supply its own worker-soldiers."
 rpr_red_ecumene:0 "Proclaim the Red Ecumene"
 rpr_red_ecumene_desc:0 "Rome was always meant to be universal. So is the revolution."
 rpr_comrades_in_moscow:0 "Comrades in the Third Rome"
 rpr_comrades_in_moscow_desc:0 "Moscow once called itself the Third Rome. The Second Rome still stands, and it is willing to work with Moscow."
 rpr_varangian_guard:0 "The Red Varangian Guard"
 rpr_varangian_guard_desc:0 "Raise an elite guard from foreign volunteers loyal only to the revolution."
 rpr_restore_the_western_provinces:0 "Restore the Western Provinces"
 rpr_restore_the_western_provinces_desc:0 "The Senate and People of Rome have never given up their claim to the city whose name they carry."
 rpr_last_war_of_antiquity:0 "The Last War of Antiquity"
 rpr_last_war_of_antiquity_desc:0 "Rome and Persia have fought for two thousand years. This war will be the last. The Saoshyant's theocracy will be swept into the dustbin of history."
 rpr_five_year_plan_of_justinian:0 "The Five-Year Plan of Justinian"
 rpr_five_year_plan_of_justinian_desc:0 "Justinian rebuilt an empire. The workers will rebuild an economy."
 rpr_anatolian_arsenals:0 "Anatolian Arsenals"
 rpr_anatolian_arsenals_desc:0 "The plateau of Anatolia will be the forge of the revolution."
 rpr_collectivise_the_nile:0 "Collectivise the Nile"
 rpr_collectivise_the_nile_desc:0 "Egypt was the granary of Rome for centuries. Now it will be the granary of the proletariat."
 rpr_roads_of_the_legions:0 "Roads of the Legions"
 rpr_roads_of_the_legions_desc:0 "Rebuild the old imperial roads for lorries and railways."
 rpr_greek_fire:0 "Greek Fire Programme"
 rpr_greek_fire_desc:0 "The oldest secret weapon of the Romans will be put to use by the newest Romans."
 rpr_dromon_fleet:0 "The Red Dromon Fleet"
 rpr_dromon_fleet_desc:0 "The Republic will once again rule the seas around the Queen of Cities."
 rpr_second_hagia_sophia:0 "The People's Academy of Magnaura"
 rpr_second_hagia_sophia_desc:0 "Reopen the ancient university of Magnaura as a temple of scientific socialism."

 # ---- Saoshyantate focus tree ----
 sao_coming_of_the_saoshyant:0 "The Coming of the Saoshyant"
 sao_coming_of_the_saoshyant_desc:0 "The prophecy is fulfilled. All of Eranshahr must know it."
 sao_council_of_magi:0 "Empower the Council of Magi"
 sao_council_of_magi_desc:0 "The magi will be the hands of the Saoshyant in every province."
 sao_immortals_reborn:0 "The Immortals Reborn"
 sao_immortals_reborn_desc:0 "Revive the elite guard of the Achaemenid kings."
 sao_path_of_the_lone_flame:0 "Path of the Lone Flame"
 sao_path_of_the_lone_flame_desc:0 "Eranshahr will stand alone, as it always has."
 sao_concord_of_the_sacred_fire:0 "Concord of the Sacred Fire"
 sao_concord_of_the_sacred_fire_desc:0 "All who oppose the godless Romans may shelter by our fire."
 sao_cataphracts_of_steel:0 "Cataphracts of Steel"
 sao_cataphracts_of_steel_desc:0 "The armoured cavalry of the Parthians will return as armoured divisions."
 sao_asha_against_druj:0 "Asha Against Druj"
 sao_asha_against_druj_desc:0 "Truth must make war on the Lie. The materialist Romans deny the Wise Lord himself, and the Saoshyant has declared them the servants of Angra Mainyu."
 sao_frashokereti:0 "Frashokereti"
 sao_frashokereti_desc:0 "Declare the beginning of the final renovation of the world."
 sao_fire_temples_of_industry:0 "Fire Temples of Industry"
 sao_fire_temples_of_industry_desc:0 "Every new factory will be consecrated with a sacred flame."
 sao_oil_of_the_gulf:0 "Black Fire of the Gulf"
 sao_oil_of_the_gulf_desc:0 "The fire that burns under the earth of Khuzestan will drive the nation's industry."
 sao_qanat_network:0 "The Great Qanat Network"
 sao_qanat_network_desc:0 "The ancient underground channels will be joined by modern roads and railways."
 sao_forges_of_isfahan:0 "Forges of Isfahan"
 sao_forges_of_isfahan_desc:0 "Isfahan's craftsmen will turn from carpets to cannon."
 sao_gondishapur_academy:0 "Revive the Academy of Gondishapur"
 sao_gondishapur_academy_desc:0 "The greatest centre of learning in the ancient world will be rebuilt."
 sao_fleet_of_the_persian_gulf:0 "Fleet of the Persian Gulf"
 sao_fleet_of_the_persian_gulf_desc:0 "Eranshahr must command the sea routes to India."

 # ---- Decisions ----
 rpr_proletarian_ecumene:0 "The Proletarian Ecumene"
 rpr_proletarian_ecumene_desc:0 "Manage the Republic's revolution at home and abroad."
 rpr_hippodrome_rally:0 "Rally in the Hippodrome"
 rpr_hippodrome_rally_desc:0 "Gather the masses where the chariot factions once fought."
 rpr_expropriate_the_monasteries:0 "Expropriate the Monasteries"
 rpr_expropriate_the_monasteries_desc:0 "The great monastic estates will become people's property."
 rpr_agitate_in_ctesiphon:0 "Agitate in Ctesiphon"
 rpr_agitate_in_ctesiphon_desc:0 "Support the Neo-Mazdakite underground in the Saoshyantate."
 sao_sacred_fire:0 "The Sacred Fire"
 sao_sacred_fire_desc:0 "Tend the faith and the strength of Eranshahr."
 sao_kindle_an_atash_behram:0 "Kindle an Atash Behram"
 sao_kindle_an_atash_behram_desc:0 "Consecrate a new Fire of Victory, the highest grade of sacred fire."
 sao_magian_census:0 "Magian Census"
 sao_magian_census_desc:0 "The magi will count every faithful family and call up its sons."
 sao_denounce_the_druj:0 "Denounce the Druj"
 sao_denounce_the_druj_desc:0 "Broadcast the Saoshyant's sermons against the godless Romans across the border."

 # ---- Events ----
 byzsao.2.t:0 "The Last War of Antiquity"
 byzsao.2.d:0 "For the hundredth time in two thousand years, Roman and Persian armies are moving towards the Euphrates. This time the Romans march under the red banner of the proletariat, and the Eranians march under the sacred fire of the Saoshyant. Both sides say this will be the last war between them."
 byzsao.2.a:0 "History repeats itself."
 byzsao.2.b:0 "Forward to Ctesiphon!"
 byzsao.2.c:0 "Asha will triumph!"
 byzsao.3.t:0 "The Saoshyant Speaks"
 byzsao.3.d:0 "Before a crowd of a hundred thousand at the Atash Behram of Yazd, Saoshyant Astvat-ereta announced that the last age of the world has arrived. He told his followers that the faithful must be ready either to fight the Lie or to purify the land."
 byzsao.3.a:0 "\"Fight the Lie!\""
 byzsao.3.b:0 "\"Purify the land.\""
 byzsao.4.t:0 "The Icon Question Returns"
 byzsao.4.d:0 "The Proletarian Synod is divided once more over images. Iconoclast Marxists want every symbol of the old faith torn down. Iconodule Marxists say the revolution needs saints and icons of its own to hold the loyalty of the people."
 byzsao.4.a:0 "Smash the icons, keep the order."
 byzsao.4.b:0 "Paint new icons, red ones."
